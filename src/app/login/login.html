<div class="screen-inner">
  <button class="back-btn" type="button" routerLink="" aria-label="Go back to home">← {{ language.t('authBackBtn') }}</button>
  <div class="form-card">
    <h2 id="loginHeading">{{ language.t('login_welcome') }}</h2>
    <p class="form-lede" id="loginLede">{{ language.t('login_phrase') }}</p>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      aria-labelledby="loginHeading"
      aria-describedby="loginLede"
    >
      <div class="form-group full">
        <label for="loginEmail">{{ language.t('login_email') }}</label>
        <input
          id="loginEmail"
          type="email"
          formControlName="email"
          [placeholder]="language.t('login_emailPlaceholder')"
          aria-required="true"
        />
      </div>

      <div class="form-group full">
        <label for="loginPassword">{{ language.t('login_password') }}</label>
        <input
          id="loginPassword"
          type="password"
          formControlName="password"
          [placeholder]="language.t('login_passwordPlaceholder')"
          aria-required="true"
        />
      </div>

      <div class="form-row-between">
        <label class="checkbox inline">
          <input id="rememberMe" type="checkbox" formControlName="rememberMe" />
          <span>{{ language.t('login_checkbox') }}</span>
        </label>
        <a href="#" class="text-link">{{ language.t('login_forgotPassword') }}</a>
      </div>

      @if (errorMessage()) {
        <p class="error" role="alert">{{ errorMessage() }}</p>
      }

      <button
        class="submit-btn"
        id="loginSubmit"
        type="submit"
        [disabled]="isSubmitting()"
        [attr.aria-busy]="isSubmitting()"
      >
        {{ isSubmitting() ? language.t('login_loggingIn') : language.t('login_loginBtn') }}
      </button>
    </form>
  </div>
</div>
