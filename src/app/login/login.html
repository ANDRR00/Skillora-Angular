<div class="screen-inner">
  <button class="back-btn" type="button" routerLink="" aria-label="Go back to home">← Back</button>
  <div class="form-card">
    <p class="card-eyebrow small">Card No. 01</p>
    <h2 id="loginHeading">Welcome back</h2>
    <p class="form-lede" id="loginLede">Log in to keep working the ledger.</p>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      aria-labelledby="loginHeading"
      aria-describedby="loginLede"
    >
      <div class="form-group full">
        <label for="loginEmail">Email *</label>
        <input
          id="loginEmail"
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          aria-required="true"
        />
      </div>

      <div class="form-group full">
        <label for="loginPassword">Password *</label>
        <input
          id="loginPassword"
          type="password"
          formControlName="password"
          placeholder="Enter password"
          aria-required="true"
        />
      </div>

      <div class="form-row-between">
        <label class="checkbox inline">
          <input id="rememberMe" type="checkbox" formControlName="rememberMe" />
          <span>Remember me</span>
        </label>
        <a href="#" class="text-link">Forgot password?</a>
      </div>

      @if (errorMessage()) {
        <p class="error" role="alert">{{ errorMessage() }}</p>
      }

      <button
        class="submit-btn"
        id="loginSubmit"
        type="submit"
        [disabled]="isSubmitting()"
        [attr.aria-busy]="isSubmitting()"
      >
        {{ isSubmitting() ? 'Logging in...' : 'Log In' }}
      </button>
    </form>
  </div>
</div>
