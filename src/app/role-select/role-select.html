<div class="screen-inner landing-inner">
  <button class="back-btn" type="button" routerLink="" [attr.aria-label]="language.t('authBackBtn')">
    ← {{ language.t('authBackBtn') }}
  </button>
  <h2 class="hero-title small" id="roleSelectHeading">
    {{ language.t('roleSelect_headingPart') }}<br>{{ language.t('roleSelect_headingEm') }}
  </h2>
  <p class="hero-sub">{{ language.t('roleSelect_sub') }}</p>

  <div class="card-row" role="group" aria-labelledby="roleSelectHeading">
    <button
      class="id-card"
      type="button"
      routerLink="/employerRegistration"
      [attr.aria-label]="language.t('roleSelect_employerAria')"
    >
      <span class="rivet rivet-l" aria-hidden="true"></span><span class="rivet rivet-r" aria-hidden="true"></span>

      <span class="card-eyebrow">{{ language.t('roleSelect_employerCardNo') }}</span>
      <span class="card-title">{{ language.t('roleSelect_employerTitle') }}</span>

      <span class="card-features">
        <span>{{ language.t('roleSelect_employerFeature1') }}</span>
        <span>{{ language.t('roleSelect_employerFeature2') }}</span>
        <span>{{ language.t('roleSelect_employerFeature3') }}</span>
        <span>{{ language.t('roleSelect_employerFeature4') }}</span>
      </span>

      <span class="card-stub">{{ language.t('roleSelect_employerStub') }}</span>
    </button>

    <button
      class="id-card"
      type="button"
      routerLink="/freelancerRegistration"
      [attr.aria-label]="language.t('roleSelect_freelancerAria')"
    >
      <span class="rivet rivet-l" aria-hidden="true"></span><span class="rivet rivet-r" aria-hidden="true"></span>

      <span class="card-eyebrow">{{ language.t('roleSelect_freelancerCardNo') }}</span>
      <span class="card-title">{{ language.t('roleSelect_freelancerTitle') }}</span>

      <span class="card-features">
        <span>{{ language.t('roleSelect_freelancerFeature1') }}</span>
        <span>{{ language.t('roleSelect_freelancerFeature2') }}</span>
        <span>{{ language.t('roleSelect_freelancerFeature3') }}</span>
        <span>{{ language.t('roleSelect_freelancerFeature4') }}</span>
      </span>

      <span class="card-stub">{{ language.t('roleSelect_freelancerStub') }}</span>
    </button>
  </div>
</div>
