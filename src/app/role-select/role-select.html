<div class="screen-inner landing-inner">
  <button class="back-btn" type="button" routerLink="" aria-label="Go back to home">← Back</button>
  <h2 class="hero-title small" id="roleSelectHeading">Which seat<br>are you taking?</h2>
  <p class="hero-sub">Pick a side of the table. You can't be both — yet.</p>

  <div class="card-row" role="group" aria-labelledby="roleSelectHeading">
    <button
      class="id-card"
      type="button"
      routerLink="/employerRegistration"
      aria-label="Register as an employer to hire freelancers"
    >
      <span class="rivet rivet-l" aria-hidden="true"></span><span class="rivet rivet-r" aria-hidden="true"></span>

      <span class="card-eyebrow">Card No. 01A</span>
      <span class="card-title">I'm Hiring</span>

      <span class="card-features">
        <span>Publish freelance projects and job opportunities</span>
        <span>Browse freelancer profiles, resumes, and portfolios</span>
        <span>Recruit professionals for freelance, part-time, or full-time roles</span>
        <span>Connect with qualified candidates quickly</span>
      </span>

      <span class="card-stub">EMPLOYER · SEAT</span>
    </button>

    <button
      class="id-card"
      type="button"
      routerLink="/freelancerRegistration"
      aria-label="Register as a freelancer to find work"
    >
      <span class="rivet rivet-l" aria-hidden="true"></span><span class="rivet rivet-r" aria-hidden="true"></span>

      <span class="card-eyebrow">Card No. 02B</span>
      <span class="card-title">I'm Freelancing</span>

      <span class="card-features">
        <span>Browse freelance projects and job openings</span>
        <span>Apply for work directly through the platform</span>
        <span>Showcase completed projects automatically on your profile</span>
        <span>Get discovered by companies looking for talent</span>
      </span>

      <span class="card-stub">FREELANCER · SEAT</span>
    </button>
  </div>
</div>
