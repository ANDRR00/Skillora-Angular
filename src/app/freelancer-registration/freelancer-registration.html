<div class="screen-inner">
  <button class="back-btn" type="button" routerLink="/roleSelection" aria-label="Go back to role selection">← Back</button>
  <div class="form-card wide">
    <p class="card-eyebrow small">Card No. 02B</p>
    <h2 id="freelancerFormHeading">Freelancer Information</h2>
    <p class="form-lede" id="freelancerFormLede">Complete your personal information.</p>

    <form
      [formGroup]="freelancerForm"
      (ngSubmit)="onSubmit()"
      aria-labelledby="freelancerFormHeading"
      aria-describedby="freelancerFormLede"
    >
      <div class="form-row">
        <div class="form-group">
          <label for="fl_firstName">First Name *</label>
          <input type="text" placeholder="First name" required aria-required="true" id="fl_firstName" formControlName="firstName">
        </div>
        <div class="form-group">
          <label for="fl_lastName">Last Name *</label>
          <input type="text" placeholder="Last name" required aria-required="true" id="fl_lastName" formControlName="lastName">
        </div>
      </div>

      <div class="form-group full">
        <label for="fl_email">Email *</label>
        <input type="email" placeholder="example@gmail.com" required aria-required="true" id="fl_email" formControlName="email">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="fl_password">Password *</label>
          <input type="password" placeholder="Enter password" required aria-required="true" id="fl_password" formControlName="password">
        </div>
        <div class="form-group">
          <label for="fl_repeatPassword">Repeat Password *</label>
          <input type="password" placeholder="Repeat password" required aria-required="true" id="fl_repeatPassword" formControlName="repeatPassword">
        </div>
      </div>

      <div class="form-row three">
        <div class="form-group">
          <label for="fl_city">City *</label>
          <input type="text" placeholder="City" required aria-required="true" id="fl_city" formControlName="city">
        </div>
        <div class="form-group">
          <label for="fl_street">Street *</label>
          <input type="text" placeholder="Street" required aria-required="true" id="fl_street" formControlName="street">
        </div>
        <div class="form-group">
          <label for="fl_postalCode">Postal Code *</label>
          <input type="text" placeholder="Postal code" required aria-required="true" id="fl_postalCode" formControlName="postalCode">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="fl_personalId">Personal ID Number *</label>
          <input type="text" placeholder="11 digit ID" required aria-required="true" id="fl_personalId" formControlName="personalId">
        </div>
        <div class="form-group">
          <label for="fl_birthDate">Date of Birth *</label>
          <input type="date" required aria-required="true" id="fl_birthDate" formControlName="birthDate">
        </div>
      </div>

      <div class="form-group full">
        <label for="fl_aboutMe">About Me</label>
        <textarea placeholder="Tell clients something about yourself..." id="fl_aboutMe" formControlName="aboutMe"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="fl_portfolio">Portfolio</label>
          <input type="url" placeholder="https://github.com/username" id="fl_portfolio" formControlName="portfolio">
        </div>
        <div class="form-group">
          <label for="fl_resume">Resume</label>
          <input type="file" id="fl_resume" accept=".pdf,.doc,.docx" aria-describedby="fl_resumeHint" (change)="onResumeSelected($event)">
          <span id="fl_resumeHint" class="visually-hidden">Accepted formats: PDF, DOC, DOCX</span>
        </div>
      </div>

      <label class="checkbox">
        <input type="checkbox" id="fl_terms" required aria-required="true" formControlName="terms">
        <span>Yes, I understand and agree to the <strong>Terms of Service</strong>, including the <strong>User
            Agreement</strong> and <strong>Privacy Policy</strong>.</span>
      </label>

      <button
        class="submit-btn"
        type="submit"
        id="fl_submitBtn"
        [disabled]="isSubmitting"
        [attr.aria-busy]="isSubmitting"
      >
        {{ isSubmitting ? 'Creating Account...' : originalBtnText }}
      </button>
    </form>
  </div>
</div>
